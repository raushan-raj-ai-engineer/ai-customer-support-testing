name: AI SDET Quality Gate


on:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:


permissions:
  contents: read


jobs:

  python-quality:

    name: Python AI Quality

    runs-on: ubuntu-latest

    timeout-minutes: 30


    steps:

      - name: Checkout
        uses: actions/checkout@v7


      - name: Setup Python
        uses: actions/setup-python@v7

        with:
          python-version: "3.13"


      - name: Create virtual environment

        run: |
          python -m venv .venv


      - name: Install Python dependencies

        run: |
          .venv/bin/python -m pip install \
            --upgrade pip

          .venv/bin/pip install \
            -r requirements.txt


      - name: Build policy vector database

        run: |
          .venv/bin/python \
            -m scripts.build_vector_db


      - name: Run deterministic Python tests

        run: |
          .venv/bin/pytest \
            -v \
            -m \
            "not live_llm and not deepeval and not live_agent and not live_langsmith"


      - name: Run deterministic security gate

        run: |
          .venv/bin/python \
            -m scripts.run_security_gate



  playwright-e2e:

    name: Playwright UI E2E

    runs-on: ubuntu-latest

    timeout-minutes: 20


    steps:

      - name: Checkout
        uses: actions/checkout@v7


      - name: Setup Node
        uses: actions/setup-node@v7

        with:
          node-version: "24"
          cache: npm


      - name: Setup Python

        uses: actions/setup-python@v7

        with:
          python-version: "3.13"


      - name: Install Node dependencies

        run: |
          npm ci


      - name: Install Chromium

        run: |
          npx playwright install \
            --with-deps \
            chromium


      - name: Run Playwright E2E tests

        run: |
          npm run test:e2e


      - name: Upload Playwright report

        if: ${{ !cancelled() }}

        uses: actions/upload-artifact@v6

        with:
          name: playwright-report

          path: playwright-report/

          retention-days: 14



  release-gate:

    name: Final Release Gate

    runs-on: ubuntu-latest

    needs:
      - python-quality
      - playwright-e2e


    steps:

      - name: Release gate passed

        run: |
          echo "================================="
          echo "AI SDET RELEASE GATE: PASSED"
          echo "================================="
          echo "Python quality      : PASS"
          echo "Security gate       : PASS"
          echo "Playwright E2E      : PASS"
          echo "================================="