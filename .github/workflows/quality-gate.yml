name: AI Customer Support Quality Gate

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  # =========================================================
  # PYTHON QUALITY GATE
  # =========================================================

  python-quality:
    name: Python Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Create virtual environment
        run: |
          python -m venv .venv

      - name: Install Python dependencies
        run: |
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build vector database
        run: |
          source .venv/bin/activate
          python -m scripts.build_vector_db

      - name: Run deterministic Python tests
        run: |
          source .venv/bin/activate

          pytest -v \
            -m "not live_llm and not deepeval and not live_agent and not live_langsmith"

      - name: Run security quality gate
        run: |
          source .venv/bin/activate
          python -m scripts.run_security_gate


  # =========================================================
  # PLAYWRIGHT E2E
  # =========================================================

  playwright-e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Node dependencies
        run: |
          npm ci

      - name: Install Playwright Chromium
        run: |
          npx playwright install --with-deps chromium

      - name: TypeScript compile check
        run: |
          npx tsc --noEmit

      - name: Run Playwright E2E tests
        run: |
          npm run test:e2e

      # -------------------------------------------------------
      # PLAYWRIGHT HTML REPORT
      #
      # Upload even when tests fail.
      # -------------------------------------------------------

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # -------------------------------------------------------
      # SCREENSHOTS + TRACES + VIDEOS
      #
      # stepWithScreenshot() screenshots are stored under
      # test-results/.
      # -------------------------------------------------------

      - name: Upload Playwright screenshots traces and videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14


  # =========================================================
  # FINAL RELEASE GATE
  #
  # This job succeeds only when both mandatory jobs succeed.
  # =========================================================

  release-gate:
    name: Final Release Gate
    runs-on: ubuntu-latest

    needs:
      - python-quality
      - playwright-e2e

    steps:
      - name: Confirm release quality gates
        run: |
          echo "=============================================="
          echo "AI CUSTOMER SUPPORT RELEASE GATE"
          echo "=============================================="
          echo
          echo "Python deterministic regression : PASS"
          echo "Security quality gate           : PASS"
          echo "TypeScript compile              : PASS"
          echo "Playwright E2E                  : PASS"
          echo
          echo "FINAL RELEASE GATE: PASSED"
          echo "=============================================="