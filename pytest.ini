[pytest]

pythonpath = .

testpaths = tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    live_llm: tests requiring a running local Ollama model
    deepeval: DeepEval LLM-as-a-Judge evaluation tests
    live_agent: tests requiring the live LangGraph/Ollama agent
    live_langsmith: tests requiring LangSmith cloud connectivity
    security: deterministic AI security and guardrail tests

addopts =
    -ra